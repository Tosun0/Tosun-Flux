name: Publish web container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Source/TosunFluxBackend/**
      - Source/TosunFluxWeb/**
      - Content/TosunFlux/**
      - Build/Dockerfile.Web
      - .github/workflows/publish-web-container.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Build/Dockerfile.Web
          push: true
          tags: |
            ghcr.io/tosun0/tosun-flux-web:latest
            ghcr.io/tosun0/tosun-flux-web:${{ github.sha }}
